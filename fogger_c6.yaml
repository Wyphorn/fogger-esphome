# Fogger LED-1200: an ESP32-C6 feeds the codes by wire into the DATA line
# of the unplugged 433 MHz receiver (JST GND / DO / 5V). No more radio.
# Note: without a level shifter (see fogger.yaml) 3.3 V was not enough for the fogger.
# Codes and protocol: codes.md. Old radio version with nanoCUL: fogger_cul.yaml
#
# Wiring (receiver module unplugged):
#   ESP GND    -> JST GND
#   ESP GPIO19 -> 1 kOhm -> JST DO
#   ESP powered separately (USB) at the time, not from the fogger's 5V pin
esphome:
  name: fogger

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret fogger_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none   # power saving off: otherwise dropouts with weak signal

debug:
  update_interval: 60s

# Idle LOW, HIGH = "carrier present", like the output of the radio receiver
remote_transmitter:
  id: wire
  pin: GPIO19
  carrier_duty_percent: 100%   # no carrier, plain baseband

script:
  # Sends A7 FC <cmd> <~cmd>: sync 400 µs H / 12.9 ms L, then 32 bits MSB first,
  # 0 = 400 H / 1200 L, 1 = 1200 H / 400 L. Repeated 4x like a short button press.
  - id: send_code
    parameters:
      cmd: int
    mode: queued
    then:
      - lambda: |-
          const uint32_t code = 0xA7FC0000u | ((uint32_t)(cmd & 0xFF) << 8) | (~(uint32_t)cmd & 0xFF);
          auto call = id(wire).transmit();
          auto *d = call.get_data();
          d->set_carrier_frequency(0);
          d->mark(400);
          d->space(12900);
          for (int i = 31; i >= 0; i--) {
            if ((code >> i) & 1) { d->mark(1200); d->space(400); }
            else                 { d->mark(400);  d->space(1200); }
          }
          call.set_send_times(4);
          call.set_send_wait(0);
          call.perform();
      - delay: 300ms   # 4 x ~66 ms + margin

  # Fog burst: ON, OFF after the set time. Runs on the ESP, even if HA goes away.
  - id: fog_burst
    mode: restart
    then:
      - script.stop: fog_on
      - script.execute: { id: send_code, cmd: 0x01 }
      - delay: !lambda 'return id(fog_seconds).state * 1000;'
      - script.execute: { id: send_code, cmd: 0x03 }

  # Fog ON with safety timer: OFF is sent after fog_max_s at the latest
  - id: fog_on
    mode: restart
    then:
      - script.execute: { id: send_code, cmd: 0x01 }
      - delay: !lambda 'return id(fog_max_s).state * 1000;'
      - script.execute: { id: send_code, cmd: 0x03 }

sensor:
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s
  - platform: uptime
    name: "Laufzeit"

text_sensor:
  - platform: debug
    reset_reason:
      name: "Neustart-Grund"

number:
  - platform: template
    id: fog_max_s
    name: "Nebel ON Höchstdauer"
    unit_of_measurement: s
    min_value: 1
    max_value: 20
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: true
  - platform: template
    id: fog_seconds
    name: "Nebelstoß Dauer"
    unit_of_measurement: s
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true

button:
  - platform: template
    name: "Nebelstoß"
    icon: mdi:weather-fog
    on_press:
      - script.execute: fog_burst
  - platform: template
    name: "Nebel ON"
    icon: mdi:weather-fog
    on_press:
      - script.stop: fog_burst
      - script.execute: fog_on
  - platform: template
    name: "Nebel OFF"
    on_press:
      - script.stop: fog_on
      - script.stop: fog_burst
      - script.execute: { id: send_code, cmd: 0x03 }
  - platform: template
    name: "Rot"
    on_press:
      - script.execute: { id: send_code, cmd: 0x04 }
  - platform: template
    name: "Grün"
    on_press:
      - script.execute: { id: send_code, cmd: 0x05 }
  - platform: template
    name: "Blau"
    on_press:
      - script.execute: { id: send_code, cmd: 0x06 }
  - platform: template
    name: "Jump"
    on_press:
      - script.execute: { id: send_code, cmd: 0x07 }
  - platform: template
    name: "Gradual change"
    on_press:
      - script.execute: { id: send_code, cmd: 0x08 }
  - platform: template
    name: "Pulse change"
    on_press:
