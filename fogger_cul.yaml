# Fogger LED-1200 via 433 MHz: an ESP32-C6 drives a nanoCUL (SIGNALduino) over UART.
# Codes and protocol: codes.md
esphome:
  name: fogger

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret fogger_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none   # power saving off: otherwise dropouts with weak signal

debug:
  update_interval: 60s

# nanoCUL: Nano D0 (RX) to GPIO19, Nano D1 (TX) via 10k/20k divider to GPIO20
uart:
  id: cul
  tx_pin: GPIO19
  rx_pin: GPIO20
  baud_rate: 57600
  debug:
    direction: BOTH
    dummy_receiver: true
    after:
      delimiter: "\n"
    sequence:
      - lambda: UARTDebug::log_string(direction, bytes);

script:
  - id: send_code
    parameters:
      cmd: string
    mode: queued
    then:
      - uart.write:
          id: cul
          data: !lambda 'return std::vector<uint8_t>(cmd.begin(), cmd.end());'
      - delay: 700ms   # 6 repeats of ~65 ms + margin

  # Fog burst: ON, OFF after the set time. Runs on the ESP, even if HA goes away.
  - id: fog_burst
    mode: restart
    then:
      - script.stop: fog_on
      - script.execute:
          id: send_code
          cmd: "SR;R=6;P0=400;P1=-1200;P2=1200;P3=-400;P4=-12900;D=042301230101232323232323232323010101010101010101232323232323232301;\n"
      - delay: !lambda 'return id(fog_seconds).state * 1000;'
      - script.execute:
          id: send_code
          cmd: "SR;R=6;P0=400;P1=-1200;P2=1200;P3=-400;P4=-12900;D=042301230101232323232323232323010101010101010123232323232323230101;\n"

  # Fog ON with safety timer: OFF is sent after fog_max_s at the latest
  - id: fog_on
    mode: restart
    then:
      - script.execute:
          id: send_code
          cmd: "SR;R=6;P0=400;P1=-1200;P2=1200;P3=-400;P4=-12900;D=042301230101232323232323232323010101010101010101232323232323232301;\n"
      - delay: !lambda 'return id(fog_max_s).state * 1000;'
      - script.execute:
          id: send_code
          cmd: "SR;R=6;P0=400;P1=-1200;P2=1200;P3=-400;P4=-12900;D=042301230101232323232323232323010101010101010123232323232323230101;\n"

sensor:
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s
  - platform: uptime
    name: "Laufzeit"

text_sensor:
  - platform: debug
    reset_reason:
      name: "Neustart-Grund"

number:
  - platform: template
    id: fog_max_s   # new id so the old stored value (60 s) does not come back
    name: "Nebel ON Höchstdauer"
    unit_of_measurement: s
    min_value: 1
    max_value: 20
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: true
  - platform: template
    id: fog_seconds
    name: "Nebelstoß Dauer"
    unit_of_measurement: s
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true

button:
  - platform: template
    name: "Nebelstoß"
    icon: mdi:weather-fog
    on_press:
      - script.execute: fog_burst
  - platform: template
    name: "Nebel ON"
    icon: mdi:weather-fog
    on_press:
      - script.stop: fog_burst
      - script.execute: fog_on
  - platform: template
    name: "Nebel OFF"
    on_press:
      - script.stop: fog_on
      - script.stop: fog_burst
      - script.execute:
          id: send_code
          cmd: "SR;R=6;P0=400;P1=-1200;P2=1200;P3=-400;P4=-12900;D=042301230101232323232323232323010101010101010123232323232323230101;\n"
