# Fogger LED-1200: ESP8266 (D1 Mini) speist die Codes per Draht in die DATA-Leitung
# des ausgesteckten 433-MHz-Empfaengers ein (JST GND / DO / 5V). Kein Funk mehr.
# Codes und Protokoll: codes.md. Alte Funk-Variante mit nanoCUL: fogger_cul.yaml, C6-Variante: fogger_c6.yaml
#
# Verdrahtung (Funkmodul abgesteckt):
#   ESP GND    -> JST GND
#   D1 Mini D1 (GPIO5) -> 1 kOhm -> Basis NPN; Kollektor -> JST DO + 10k nach JST 5V; Emitter -> GND
#   (nicht D3/D4/D8 = Boot-Pins, nicht TX/RX)
#   D1 Mini 5V <- JST 5V (ESP laeuft nur, wenn der Fogger an ist), Elko am D1 Mini
esphome:
  name: fogger

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: !secret fogger_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none   # Stromsparen aus: bei schwachem Signal sonst Aussetzer

debug:
  update_interval: 60s

# DO: Ruhepegel LOW, HIGH = "Traeger da" wie am Ausgang des Funkempfaengers.
# Pegelwandler NPN: D1 -> 1k -> Basis, Kollektor an DO mit 10k Pull-up auf JST 5V,
# Emitter an GND. Der Transistor invertiert, deshalb inverted: true.
remote_transmitter:
  id: wire
  pin:
    number: GPIO5    # D1
    inverted: true
  carrier_duty_percent: 100%   # kein Traeger, reines Basisband

script:
  # Sendet A7 FC <cmd> <~cmd>: Sync 400 µs H / 12.9 ms L, dann 32 Bit MSB zuerst,
  # 0 = 400 H / 1200 L, 1 = 1200 H / 400 L. 4x wiederholt wie eine kurz gedrueckte Taste.
  - id: send_code
    parameters:
      cmd: int
    mode: queued
    then:
      - lambda: |-
          const uint32_t code = 0xA7FC0000u | ((uint32_t)(cmd & 0xFF) << 8) | (~(uint32_t)cmd & 0xFF);
          auto call = id(wire).transmit();
          auto *d = call.get_data();
          d->set_carrier_frequency(0);
          d->mark(400);
          d->space(12900);
          for (int i = 31; i >= 0; i--) {
            if ((code >> i) & 1) { d->mark(1200); d->space(400); }
            else                 { d->mark(400);  d->space(1200); }
          }
          call.set_send_times(4);
          call.set_send_wait(0);
          call.perform();
      - delay: 300ms   # 4 x ~66 ms + Puffer

  # Nebelstoss: ON, nach der Zeit OFF. Laeuft im ESP, auch wenn HA wegfaellt.
  - id: fog_burst
    mode: restart
    then:
      - script.stop: fog_on
      - script.execute: { id: send_code, cmd: 0x01 }
      - delay: !lambda 'return id(fog_seconds).state * 1000;'
      - script.execute: { id: send_code, cmd: 0x03 }

  # Nebel ON mit Sicherheits-Timer: spaetestens nach fog_max_s kommt OFF
  - id: fog_on
    mode: restart
    then:
      - script.execute: { id: send_code, cmd: 0x01 }
      - delay: !lambda 'return id(fog_max_s).state * 1000;'
      - script.execute: { id: send_code, cmd: 0x03 }

sensor:
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s
  - platform: uptime
    name: "Laufzeit"

text_sensor:
  - platform: debug
    reset_reason:
      name: "Neustart-Grund"

number:
  - platform: template
    id: fog_max_s
    name: "Nebel ON Höchstdauer"
    unit_of_measurement: s
    min_value: 1
    max_value: 20
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: true
  - platform: template
    id: fog_seconds
    name: "Nebelstoß Dauer"
    unit_of_measurement: s
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true

button:
  - platform: template
    name: "Nebelstoß"
    icon: mdi:weather-fog
    on_press:
      - script.execute: fog_burst
  - platform: template
    name: "Nebel ON"
    icon: mdi:weather-fog
    on_press:
      - script.stop: fog_burst
      - script.execute: fog_on
  - platform: template
    name: "Nebel OFF"
    on_press:
      - script.stop: fog_on
      - script.stop: fog_burst
      - script.execute: { id: send_code, cmd: 0x03 }
  - platform: template
    name: "Rot"
    on_press:
      - script.execute: { id: send_code, cmd: 0x04 }
  - platform: template
    name: "Grün"
    on_press:
      - script.execute: { id: send_code, cmd: 0x05 }
