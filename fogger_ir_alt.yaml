# Step 1: try to read IR codes from the fogger remote (USB only, no WiFi yet).
# Turned out the fogger uses 433 MHz, not IR.
esphome:
  name: fogger

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:

remote_receiver:
  pin:
    number: GPIO20
    allow_other_uses: true
    inverted: true
    mode:
      input: true
      pullup: true
  dump: all

# Diagnostics: heartbeat + raw level at the receiver
interval:
  - interval: 5s
    then:
      - logger.log: "lebt"

binary_sensor:
  - platform: gpio
    name: "IR Rohpegel"
    pin:
      number: GPIO20
      inverted: true
      allow_other_uses: true
      mode:
        input: true
        pullup: true
